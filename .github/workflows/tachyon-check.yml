name: Tachyon health-check

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'public/tachyon-emit.js'
      - 'scripts/check-tachyon.mjs'
      - '.github/workflows/tachyon-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-tachyon.mjs --deployed
